[workspace]
resolver = "3"
members = ["crates/notelight-core", "crates/notelight-py", "crates/notelight-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/searope/notelight"
authors = ["Sergey Nefedyev"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight numeric code more than they help it.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (`scripts/build_wasm.py`). Full LTO and stripping the
# symbol names shrink the .wasm from 298 to 245 KiB (102 KiB gzipped).
# opt-level stays 3: "s" saves another 18 KiB gzipped but made vector search
# 25% slower (docs/design-notes.md, "v2 spike decisions").
[profile.wasm-release]
inherits = "release"
lto = "fat"
strip = true
