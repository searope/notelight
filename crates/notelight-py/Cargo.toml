[package]
name = "notelight-py"
description = "PyO3 bindings for notelight-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
notelight-core = { path = "../notelight-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
serde_json = "1"

[lints]
workspace = true
