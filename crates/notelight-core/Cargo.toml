[package]
name = "notelight-core"
description = "Retrieval engine for notelight: chunking, BM25, quantized vector search, index format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Deliberately free of Python, ML and async dependencies so the same crate
# compiles to native code (via PyO3) and to WebAssembly (v2).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Memory mapping is native-only; the WASM build reads index files into memory.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

# Native-only test tools: the property tests, integration tests and benchmarks
# need threads, a clock and a filesystem. The unit tests (`--lib`) also run as
# wasm32 under Node; see `.cargo/config.toml`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
