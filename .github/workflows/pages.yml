name: Pages

# Publishes the browser demo (web-demo/) to GitHub Pages: the Rust core as
# WebAssembly, the vendored onnxruntime-web, and the committed sample index of
# this repository's docs. The page downloads bge-small from Hugging Face on its
# first hybrid search, verified by SHA-256; nothing else leaves the browser.
#
# Needs Pages enabled with "Source: GitHub Actions" (Settings > Pages).
on:
  push:
    branches: [main]
    paths:
      - "web-demo/**"
      - "crates/notelight-core/**"
      - "crates/notelight-wasm/**"
      - "scripts/build_wasm.py"
      - "scripts/build_site.py"
      - "scripts/vendor_ort.py"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never
# cancels a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned toolchain as the CI lint and wasm jobs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (the version Cargo.lock pins)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build notelight-wasm into web-demo/pkg
        run: python3 scripts/build_wasm.py
      - uses: actions/cache@v6
        with:
          path: web-demo/vendor
          key: onnxruntime-web-${{ hashFiles('scripts/vendor_ort.py') }}
      - name: Vendor onnxruntime-web (pinned, verified)
        run: python3 scripts/vendor_ort.py
      - name: Assemble the site
        run: python3 scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
