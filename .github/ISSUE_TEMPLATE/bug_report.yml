name: Bug report
description: Something in notelight does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please do not open an
        issue: see [SECURITY.md](https://github.com/searope/notelight/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        notelight search "..." -f ~/notes
        Expected ..., got ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest folder and commands that show it, if you can. Full error output helps.
      render: text
  - type: textarea
    id: version
    attributes:
      label: Output of `notelight version`
      description: Lists the notelight, Rust core, Python and NumPy versions and the data directory.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x86_64, ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install notelight?
      options:
        - pip install notelight (wheel from PyPI)
        - pip install with extras, e.g. notelight[web,documents]
        - pipx or uv tool install
        - From source (git clone + pip install -e)
        - Other (say below)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options:
        - index
        - search
        - status
        - eval
        - mcp (MCP server)
        - serve (web UI)
        - PDF / DOCX
        - Python API
        - Installation
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The embedder (`bge-small`, `hashing`, `none`), the index size, the MCP client, ...
