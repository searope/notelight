[package]
name = "notelight-wasm"
description = "WebAssembly bindings for notelight-core: search an index in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# `cdylib` is the .wasm module JavaScript loads; `rlib` lets the native unit
# tests, the latency example and the wasm-bindgen tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
notelight-core = { path = "../notelight-core" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# `scripts/build_wasm.py` needs wasm-bindgen-cli at exactly this version;
# keep them in step (Cargo.lock pins the patch release).
wasm-bindgen = "0.2.129"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
