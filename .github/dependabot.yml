# Weekly, grouped update PRs for GitHub Actions and Cargo dependencies.
# The pinned clippy toolchain in ci.yml is bumped by hand, not here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
