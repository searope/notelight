name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lints are pinned to a known toolchain so a new stable release cannot
      # break CI overnight; bump deliberately and fix any new lints in one PR.
      # `@master` + `toolchain:` rather than `@1.99.0`: Dependabot reads a
      # version-like ref as the action's own version and "bumps" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p notelight-core
      - name: Docs build without warnings
        run: cargo doc -p notelight-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benchmarks compile
        run: cargo bench -p notelight-core --no-run

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml and the README badge.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  wasm:
    name: WebAssembly (core, notelight-wasm and the browser embedder under Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned toolchain as the lint job, so clippy on wasm32 sees the same lints.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install wasm-bindgen-cli (the version Cargo.lock pins)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Core builds for the browser
        run: cargo build -p notelight-core --target wasm32-unknown-unknown
      - run: cargo clippy -p notelight-core --lib --target wasm32-unknown-unknown -- -D warnings
      # All notelight-wasm targets, so the wasm-only tests/node.rs is linted too
      # (it compiles to nothing natively). The core's tests and benches need
      # native-only dev-dependencies.
      - run: cargo clippy -p notelight-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings
      # 32-bit usize: the core's unit tests as wasm32-wasip1 under Node's WASI.
      - name: Core unit tests as wasm32 (Node WASI)
        run: cargo test -p notelight-core --lib --target wasm32-wasip1
      - name: notelight-wasm native tests
        run: cargo test -p notelight-wasm
      - name: notelight-wasm JS API under Node (wasm-bindgen-test)
        run: cargo test -p notelight-wasm --test node --target wasm32-unknown-unknown
      - name: Build the demo package and report its size
        run: python3 scripts/build_wasm.py
      # The browser embedder: tokenizer parity with HF tokenizers, the
      # SHA-256 checks, and query vectors and top-10 hits against the Python
      # embedder's (web-demo/tests). The runtime is vendored from npm and the
      # model downloaded from the Hub, both verified; the model cache shares
      # its key and path with the model-check workflow.
      - uses: actions/cache@v6
        with:
          path: web-demo/vendor
          key: onnxruntime-web-${{ hashFiles('scripts/vendor_ort.py') }}
      - name: Vendor onnxruntime-web (pinned, verified)
        run: python3 scripts/vendor_ort.py
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/notelight-models
          key: bge-small-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - name: Browser embedder under Node (parity with Python)
        env:
          NOTELIGHT_MODEL_CACHE: ${{ runner.temp }}/notelight-models
          NOTELIGHT_MODEL_DOWNLOAD: "1"
        run: node --test "web-demo/tests/*.test.mjs"

  rust-windows:
    name: Rust tests on Windows (mmap + generation swap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p notelight-core

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install (editable, builds the Rust extension)
        run: python -m pip install -e ".[dev,documents,web]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: notelight version
