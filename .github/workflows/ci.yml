name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lints are pinned to a known toolchain so a new stable release cannot
      # break CI overnight; bump deliberately and fix any new lints in one PR.
      # `@master` + `toolchain:` rather than `@1.99.0`: Dependabot reads a
      # version-like ref as the action's own version and "bumps" it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p notelight-core
      - name: Docs build without warnings
        run: cargo doc -p notelight-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benchmarks compile
        run: cargo bench -p notelight-core --no-run

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml and the README badge.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  rust-windows:
    name: Rust tests on Windows (mmap + generation swap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p notelight-core

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install (editable, builds the Rust extension)
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: notelight version
