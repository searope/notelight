[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "notelight"
description = "Private semantic search over your own files, for you and your AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sergey Nefedyev" }]
keywords = ["search", "semantic-search", "rag", "mcp", "embeddings", "bm25"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "filelock>=3.13",
  "mcp>=2.3,<3",
  "numpy>=1.26",
  "onnxruntime>=1.19",
  "pathspec>=0.12",
  "platformdirs>=4",
  "tokenizers>=0.20",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["maturin>=1.8,<2", "pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11"]
# PDF and DOCX ingest (0.2). Pure-Python, permissively licensed readers.
pdf = ["pypdf>=5"]
docx = ["python-docx>=1.1"]
documents = ["notelight[pdf,docx]"]

[project.scripts]
notelight = "notelight.cli:app"

[project.urls]
Homepage = "https://github.com/searope/notelight"
Documentation = "https://github.com/searope/notelight#readme"
Repository = "https://github.com/searope/notelight"
Issues = "https://github.com/searope/notelight/issues"
Changelog = "https://github.com/searope/notelight/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/notelight-py/Cargo.toml"
python-source = "python"
module-name = "notelight._core"
features = ["pyo3/extension-module"]
# The version comes from Cargo (workspace.package.version), so there is one
# place to bump it.
include = [{ path = "CHANGELOG.md", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["notelight"]
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# Optional extras: type-checked when installed (CI installs them), and not
# an error when a dev environment leaves them out.
[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*", "docx", "docx.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["notelight"]
